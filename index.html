<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية دار القرآن</title>
    
    <link rel="icon" type="image/png" href="logo512v2.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #c99a00; --dark: #1a1a1a; --offer-red: #e74c3c; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: #fafafa; overflow-x: hidden; }

        /* تنسيق الكمبيوتر */
        @media (min-width: 601px) {
            .desktop-nav {
                position: fixed; right: 0; top: 0; bottom: 0; width: 220px;
                background: var(--dark); border-left: 3px solid var(--gold);
                display: flex; flex-direction: column; align-items: center; padding-top: 30px;
                z-index: 1001;
            }
            .desktop-nav img { width: 120px; height: 120px; border-radius: 15px; object-fit: cover; } 
            .desktop-nav .brand-name { color: var(--gold); font-weight: 900; margin: 15px 0 30px 0; font-size: 22px; }
            .desktop-nav button {
                background: transparent; color: white; border: none; width: 100%;
                padding: 15px; cursor: pointer; font-family: 'Cairo'; font-size: 16px;
                border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: center; gap: 10px;
            }
            .desktop-nav button:hover, .active-btn { background: var(--gold) !important; color: black !important; font-weight: bold; }
            main { margin-right: 220px; padding: 40px; }
            .mobile-nav, .mobile-header { display: none; }
        }

        /* تنسيق الموبايل */
        @media (max-width: 600px) {
            .desktop-nav { display: none; }
            .mobile-header { background: white; padding: 15px; text-align: center; border-bottom: 2px solid var(--gold); }
            .mobile-header img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }
            .mobile-header h2 { margin: 5px 0 0 0; font-size: 18px; color: var(--dark); }
            
            .mobile-nav {
                position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
                background: var(--dark); display: flex; justify-content: space-around;
                align-items: center; border-top: 2px solid var(--gold); z-index: 1000;
            }
            .mobile-nav button {
                background: transparent; border: none; color: white; font-size: 10px;
                display: flex; flex-direction: column; align-items: center; font-family: 'Cairo'; gap: 4px; flex: 1;
            }
            .nav-icon { font-size: 18px; }
            .active-mob { color: var(--gold) !important; }
            main { padding: 15px; padding-bottom: 100px; }
        }

        .page-section { display: none; }
        .active-section { display: block; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); margin-bottom: 20px; border-bottom: 4px solid var(--gold); text-align: center; }
        .btn-action { background: var(--gold); color: black; padding: 14px 20px; border-radius: 50px; text-decoration: none; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; cursor: pointer; border: none; font-family: 'Cairo'; width: 100%; max-width: 300px; }
        .loader-spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="desktop-nav">
        <img src="logo512v2.png" alt="Logo">
        <div class="brand-name">دار القرآن</div>
        <button onclick="showPage('home')" id="btn-home-d">🏠 الرئيسية</button>
        <button onclick="showPage('join')" id="btn-join-d">🎯 انضمام للحلقة</button>
        <button onclick="showPage('social')" id="btn-social-d">🌐 سوشيال ميديا</button>
        <button onclick="showPage('about')" id="btn-about-d">📖 من نحن</button>
        <button onclick="showPage('contact')" id="btn-contact-d">📞 تواصل معنا</button>
    </nav>

    <header class="mobile-header">
        <img src="logo512v2.png" alt="Logo">
        <h2>دار القرآن</h2>
    </header>

    <nav class="mobile-nav">
        <button onclick="showPage('home')" id="btn-home-m"><span class="nav-icon">🏠</span><span>الرئيسية</span></button>
        <button onclick="showPage('join')" id="btn-join-m"><span class="nav-icon">🎯</span><span>الاشتراك</span></button>
        <button onclick="showPage('social')" id="btn-social-m"><span class="nav-icon">🌐</span><span>سوشيال</span></button>
        <button onclick="showPage('about')" id="btn-about-m"><span class="nav-icon">📖</span><span>نحن</span></button>
        <button onclick="showPage('contact')" id="btn-contact-m"><span class="nav-icon">📞</span><span>تواصل</span></button>
    </nav>

    <main>
        <section id="home" class="page-section active-section">
            <div class="card">
                <h1 style="color: var(--gold);">أكاديمية دار القرآن</h1>
                <p>تعلم الفقه والعلوم الشرعية بأسلوب عصري ومبسط</p>
                <img src="logo512v2.png" style="width: 180px; height: 180px; margin: 15px auto; display: block; border-radius: 20px; object-fit: cover;" alt="Logo">
                <button class="btn-action" onclick="showPage('join')">✨ ابدأ رحلتك التعليمية</button>
            </div>
        </section>

        <section id="join" class="page-section">
            </section>
        
        </main>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active-section'));
            document.getElementById(pageId).classList.add('active-section');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
        // تم حذف كود الـ PWA و Service Worker
    </script>
</body>
</html>
